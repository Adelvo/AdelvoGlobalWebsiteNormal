  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // split line 2 and the subline
      function split(id, cls, byWord) {
        const el = document.getElementById(id);
        const text = el.textContent.trim();
        el.textContent = "";
        const parts = byWord ? text.split(" ").map((w, i, a) => (i < a.length - 1 ? w + " " : w)) : Array.from(text);
        return parts.map((p) => {
          const s = document.createElement("span");
          s.className = cls;
          s.textContent = p;
          el.appendChild(s);
          return s;
        });
      }
      const chars = split("in-l2", "in-ch", false);
      const subWords = split("in-sub", "in-sw", true);

      // 1. the mark draws itself, then fills along the arrow
      gsap.utils.toArray(".in-sp").forEach((p) => {
        const L = p.getTotalLength();
        p.style.strokeDasharray = L + " " + L;
        tl.fromTo(p, { strokeDashoffset: L * 0.72 }, { strokeDashoffset: 0, duration: 1.7, ease: "power2.inOut" }, 0);
      });
      tl.fromTo(
        "#in-logo-fill",
        { clipPath: "circle(0% at 0% 100%)" },
        { clipPath: "circle(150% at 0% 100%)", duration: 0.65, ease: "power2.inOut" },
        1.55,
      );
      tl.fromTo("#in-logo-stroke", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none" }, 2.05);
      tl.fromTo("#in-logo-move", { scale: 1 }, { scale: 1.09, duration: 0.12, ease: "power2.out" }, 2.16);
      tl.to("#in-logo-move", { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.5)" }, 2.28);

      // 2. the mark lifts, the headline lands under it
      tl.to("#in-logo-move", { y: -298, scale: 0.3, duration: 0.65, ease: "power3.inOut" }, 2.8);
      tl.fromTo(
        "#in-logo-move",
        { filter: "blur(0px)" },
        { keyframes: { filter: ["blur(0px)", "blur(7px)", "blur(0px)"] }, duration: 0.65, ease: "none" },
        2.8,
      );
      tl.fromTo(".in-w", { yPercent: 112 }, { yPercent: 0, duration: 0.65, ease: "expo.out", stagger: 0.08 }, 3.22);
      tl.fromTo(
        chars,
        { opacity: 0, yPercent: 38, filter: "blur(12px)" },
        { opacity: 1, yPercent: 0, filter: "blur(0px)", duration: 0.5, ease: "power4.out", stagger: 0.022 },
        3.75,
      );

      // 3. three services swing in along the orbit
      const RX = 790,
        RY = 410,
        CX = 960,
        CY = 565;
      const chips = [
        ["#in-chip1", -2.6, -1.5, -8, 4.47],
        ["#in-chip2", -0.5, -1.7, 8, 4.69],
        ["#in-chip3", 2.45, -1.6, -8, 4.91],
      ];
      chips.forEach(([sel, end, sweep, rot, at]) => {
        const el = document.querySelector(sel);
        const ex = CX + RX * Math.cos(end),
          ey = CY + RY * Math.sin(end);
        el.style.left = ex - 56 + "px";
        el.style.top = ey - 56 + "px";
        const xs = [],
          ys = [];
        for (let i = 0; i <= 14; i++) {
          const a = end + sweep * (1 - i / 14);
          xs.push(CX + RX * Math.cos(a) - ex);
          ys.push(CY + RY * Math.sin(a) - ey);
        }
        const box = el.querySelector(".in-chip-box");
        tl.fromTo(box, { x: xs[0], y: ys[0] }, { keyframes: { x: xs, y: ys }, duration: 1.05, ease: "expo.out" }, at);
        tl.fromTo(box, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, at);
        tl.fromTo(
          box,
          { scale: 0.35, rotation: rot - 50 },
          { scale: 1, rotation: rot, duration: 1.05, ease: "back.out(1.6)" },
          at,
        );
      });

      tl.fromTo(
        subWords,
        { opacity: 0, color: "#b9c6d0" },
        { opacity: 1, color: "#0c2236", duration: 0.3, ease: "power2.out", stagger: 0.07 },
        4.95,
      );

      // 4. dive through the first chip into its world
      tl.fromTo("#in-chip1 .in-chip-box", { scale: 1 }, { scale: 1.18, duration: 0.22, ease: "power2.out", immediateRender: false }, 6.78);
      tl.fromTo(
        "#in-stage",
        { scale: 1, transformOrigin: "283px 354px", filter: "blur(0px)" },
        { scale: 1.75, filter: "blur(6px)", duration: 0.55, ease: "power3.in" },
        7.0,
      );
      tl.fromTo("#in-flood-dot", { scale: 0 }, { scale: 36, duration: 0.55, ease: "power3.in" }, 7.0);

      window.__timelines["intro"] = tl;
