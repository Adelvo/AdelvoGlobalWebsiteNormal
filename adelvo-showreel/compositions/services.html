  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      function chars(id) {
        const el = document.getElementById(id);
        const text = el.textContent;
        el.textContent = "";
        return Array.from(text).map((c) => {
          const s = document.createElement("span");
          s.className = "sv-ch";
          s.textContent = c;
          el.appendChild(s);
          return s;
        });
      }
      // seeded PRNG
      let seed = 20261115;
      const rnd = () => {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };

      /* ── 1 · Offer creation: the rings settle, the offer hits dead centre ── */
      tl.fromTo("#sv-r1", { scale: 2.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.0);
      tl.fromTo("#sv-r2", { scale: 3.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.09);
      tl.fromTo(".sv-t1r", { yPercent: 115 }, { yPercent: 0, duration: 0.7, ease: "expo.out", stagger: 0.1 }, 0.12);
      tl.fromTo(
        "#sv-bull",
        { x: 900, y: -620, scale: 0.6, opacity: 0 },
        { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.32, ease: "power3.in" },
        0.78,
      );
      tl.fromTo("#sv-target", { scale: 1, transformOrigin: "520px 540px" }, { scale: 0.9, duration: 0.07, ease: "power2.out", immediateRender: false }, 1.1);
      tl.to("#sv-target", { scale: 1, duration: 0.7, ease: "elastic.out(1, 0.35)" }, 1.17);
      tl.to("#sv-bull", { scale: 1.25, duration: 0.07, ease: "power2.out" }, 1.1);
      tl.to("#sv-bull", { scale: 1, duration: 0.6, ease: "elastic.out(1, 0.4)" }, 1.17);
      // the bullseye becomes the next world
      tl.to("#sv-bull", { scale: 26, duration: 0.42, ease: "power3.in" }, 1.98);
      tl.fromTo("#sv-t1", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power1.in", immediateRender: false }, 2.05);

      /* ── 2 · Sales funnels: many prospects in, one client out ── */
      const t2 = chars("sv-t2a").concat(chars("sv-t2b"));
      tl.fromTo(
        t2,
        { opacity: 0, filter: "blur(14px)", scale: 1.25 },
        { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.4, ease: "power4.out", stagger: 0.03 },
        2.42,
      );
      const drawOn = (sel, dur, ease, at) => {
        const p = document.querySelector(sel);
        const L = p.getTotalLength();
        p.style.strokeDasharray = L + " " + L;
        tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur, ease: ease }, at);
      };
      drawOn("#sv-funnel-path", 0.6, "power2.inOut", 2.42);
      const dots = gsap.utils.toArray(".sv-dot");
      dots.forEach((d, i) => {
        const x0 = (rnd() * 2 - 1) * 165;
        const at = 2.75 + i * 0.075;
        tl.fromTo(d, { x: x0, y: -70, scale: 1 }, { y: 215, duration: 0.32, ease: "power1.in" }, at);
        tl.to(d, { x: 0, y: 520, duration: 0.42, ease: "power1.in" }, at + 0.32);
        tl.to(d, { y: 830, scale: 0.4, duration: 0.2, ease: "none" }, at + 0.74);
      });
      tl.fromTo("#sv-out", { scale: 0 }, { scale: 1, duration: 0.7, ease: "power1.out" }, 3.55);
      // the client becomes the next world
      tl.to("#sv-out", { scale: 32, duration: 0.45, ease: "power3.in" }, 4.3);
      tl.fromTo("#sv-t2", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, 4.4);

      /* ── 3 · Cold email: it lands in the inbox ── */
      tl.fromTo("#sv-env", { x: 1900, rotation: 10, filter: "blur(22px)" }, { x: 0, rotation: -6, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 4.76);
      gsap.utils.toArray(".sv-ghost").forEach((g, i) => {
        tl.fromTo(g, { x: 1900, rotation: 10, opacity: 0.32 - i * 0.14 }, { x: 0, rotation: -6, duration: 0.6, ease: "expo.out" }, 4.82 + i * 0.07);
        tl.to(g, { opacity: 0, duration: 0.25, ease: "none" }, 5.25 + i * 0.07);
      });
      drawOn("#sv-flap", 0.4, "power2.out", 5.05);
      tl.fromTo("#sv-t3a", { x: 420, opacity: 0, filter: "blur(16px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 4.92);
      tl.fromTo("#sv-t3b", { x: 420, opacity: 0, filter: "blur(16px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 5.02);

      tl.fromTo("#sv-env", { scale: 1 }, { scale: 1.04, duration: 0.08, ease: "power2.out", immediateRender: false }, 5.5);
      tl.to("#sv-env", { scale: 1, duration: 0.4, ease: "power2.out" }, 5.58);

        "#sv-w3in",
        { opacity: 1, scale: 1, filter: "blur(0px)" },
        { opacity: 0, scale: 0.94, filter: "blur(14px)", duration: 0.3, ease: "power2.in", immediateRender: false },
        6.42,
      );
      tl.fromTo("#sv-g3", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 4.8);
