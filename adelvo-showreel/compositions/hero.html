        tl.fromTo(
          chip + " .he-chip-box",
          { x: from, rotation: rot + (from < 0 ? -70 : 70), opacity: 0 },
          { x: 0, rotation: rot, opacity: 1, duration: 0.8, ease: "back.out(1.3)" },
          at,
        );
        tl.fromTo(
          lab + " span",
          { clipPath: "inset(0% 100% 0% 0%)", x: -24 },
          { clipPath: "inset(0% 0% 0% 0%)", x: 0, duration: 0.5, ease: "expo.out" },
          lat,
        );

      // CTA grows out of a pink pill
      tl.fromTo(
        "#he-cta-btn",
        { clipPath: "inset(0% 43% 0% 43% round 13px)", scale: 0.7 },
        { clipPath: "inset(0% 0% 0% 0% round 13px)", scale: 1, duration: 0.55, ease: "expo.out" },

      tl.fromTo("#he-cta-text", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 1.82);

      tl.fromTo("#he-explore-text", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 2.02);
      tl.fromTo("#he-explore-line", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 2.1);

      // the cursor arrives and clicks
      tl.fromTo(
        "#he-cursor-svg",
        { x: 760, y: 420 },
        { keyframes: { x: [760, 520, 250, 70, 0], y: [420, 340, 170, 40, 0] }, duration: 0.85, ease: "power3.out" },
        2.52,

      tl.fromTo("#he-cursor-svg", { scale: 1, transformOrigin: "15% 8%" }, { scale: 0.82, duration: 0.08, ease: "power2.in", immediateRender: false }, 3.32);
      tl.to("#he-cursor-svg", { scale: 1, duration: 0.3, ease: "power2.out" }, 3.4);
      tl.to("#he-cta-btn", { scale: 0.94, duration: 0.08, ease: "power2.in" }, 3.32);
      tl.to("#he-cta-btn", { scale: 1, duration: 0.7, ease: "elastic.out(1, 0.4)" }, 3.4);
      tl.to("#he-cta-arrow", { x: 30, y: -30, opacity: 0, duration: 0.18, ease: "power2.in" }, 3.4);

        tl.to(chip + " .he-chip-box", { y: 0, duration: 0.6, ease: "elastic.out(1, 0.45)" }, 3.64 + i * 0.09);

      tl.to("#he-cursor-svg", { x: 190, y: 120, duration: 0.9, ease: "power2.inOut" }, 4.0);
